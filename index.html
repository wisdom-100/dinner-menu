var selectedType="전체";
var selectedPrice="전체";
var current=null;

function setType(v){
 selectedType=v;
 document.querySelectorAll("#typeAll,#typeKorean,#typeJapanese,#typeChinese,#typeWestern,#typeOther").forEach(function(b){b.classList.remove("selected")});
 var ids={"전체":"typeAll","한식":"typeKorean","일식":"typeJapanese","중식":"typeChinese","양식":"typeWestern","기타":"typeOther"};
 document.getElementById(ids[v]).classList.add("selected");
}
function setPrice(v){
 selectedPrice=v;
 document.querySelectorAll("#priceAll,#priceCheap,#priceNormal,#priceExpensive").forEach(function(b){b.classList.remove("selected")});
 var ids={"전체":"priceAll","저렴":"priceCheap","보통":"priceNormal","비쌈":"priceExpensive"};
 document.getElementById(ids[v]).classList.add("selected");
}
function recommend(){
 var list=menus.filter(function(m){return (selectedType==="전체"||m[1]===selectedType)&&(selectedPrice==="전체"||m[2]===selectedPrice)});
 if(!list.length){document.getElementById("menu").textContent="조건에 맞는 메뉴가 없어요 😢";return}
 var pick=list[Math.floor(Math.random()*list.length)];
 if(list.length>1&&current){while(pick[0]===current[0])pick=list[Math.floor(Math.random()*list.length)]}
 current=pick;
 document.getElementById("menu").textContent="🍴 "+pick[0];
 document.getElementById("desc").textContent=pick[3];
 document.getElementById("price").textContent=pick[2]==="저렴"?"약 1만원 이하":pick[2]==="보통"?"약 1~2만원":"2만원 이상";
}
function saveCurrent(){
 if(!current){recommend();return}
 var key="dinnerSaved";
 var saved=JSON.parse(localStorage.getItem(key)||"[]");
 if(saved.indexOf(current[0])<0)saved.push(current[0]);
 localStorage.setItem(key,JSON.stringify(saved));
 showSaved();
}
function showSaved(){
 var box=document.getElementById("saved");
 var saved=JSON.parse(localStorage.getItem("dinnerSaved")||"[]");
 if(!saved.length){box.innerHTML='<span style="color:#aaa;font-size:14px">아직 없어요.</span>';return}
 box.innerHTML="";
 saved.forEach(function(name){
   var b=document.createElement("button");
   b.className="tag"; b.textContent="❤️ "+name;
   box.appendChild(b);
 });
}
showSaved();
</script>

<script>
(function(){
  function refreshSavedDeleteButtons(){
    var box=document.getElementById("saved");
    if(!box) return;
    var children=box.querySelectorAll("button");
    children.forEach(function(btn){
      if(btn.classList.contains("saved-delete")) return;
      var name=(btn.textContent||"").trim();
      if(!name || name==="삭제") return;
      var del=document.createElement("button");
      del.type="button";
      del.className="saved-delete";
      del.textContent="삭제";
      del.setAttribute("aria-label",name+" 삭제");
      del.addEventListener("click",function(e){
        e.preventDefault();
        e.stopPropagation();
        var savedList=JSON.parse(localStorage.getItem("savedMenus")||"[]");
        var idx=savedList.indexOf(name);
        if(idx!==-1){
          savedList.splice(idx,1);
          localStorage.setItem("savedMenus",JSON.stringify(savedList));
        }
        if(typeof renderSaved==="function") renderSaved();
        else refreshSavedDeleteButtons();
      });
      btn.parentNode.appendChild(del);
    });
  }
  var oldRender=window.renderSaved;
  if(typeof oldRender==="function"){
    window.renderSaved=function(){
      oldRender.apply(this,arguments);
      refreshSavedDeleteButtons();
    };
  }
  document.addEventListener("DOMContentLoaded",function(){
    refreshSavedDeleteButtons();
    setTimeout(refreshSavedDeleteButtons,100);
  });
})();
</script>
</body>
</html>
